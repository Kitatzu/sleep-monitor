; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Configuración de Hardware N16R8 ---
board_build.arduino.memory_type = qio_opi ; Habilita la PSRAM Octal (la R8 de tu chip)
board_build.flash_mode = qio              ; Modo de acceso rápido a la memoria Flash
board_upload.flash_size = 16MB            ; Tamaño real de tu memoria (la N16 de tu chip)
board_build.partitions = default_16MB.csv ; Define cómo repartir esos 16MB

; --- Comunicación y Debug ---
upload_port = COM3
monitor_speed = 115200

; --- Librerías del Proyecto (Dependencies) ---
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
